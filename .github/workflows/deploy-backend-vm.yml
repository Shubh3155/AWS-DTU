name: Deploy backend VM
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.AEROROUTE_DEPLOY_HOST }}
      BACKEND_URL: ${{ vars.AEROROUTE_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.lock
      - name: Verify backend
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          pytest -q
      - name: Validate private configuration
        working-directory: backend
        env:
          AEROROUTE_MAPBOX_TOKEN: ${{ secrets.AEROROUTE_MAPBOX_TOKEN }}
          AEROROUTE_DATABASE_URL: ${{ secrets.AEROROUTE_DATABASE_URL }}
          AEROROUTE_OPENAQ_API_KEY: ${{ secrets.AEROROUTE_OPENAQ_API_KEY }}
          AEROROUTE_CORS_ORIGINS: ${{ vars.AEROROUTE_CORS_ORIGINS }}
          AEROROUTE_FIREBASE_PROJECT_ID: ${{ vars.AEROROUTE_FIREBASE_PROJECT_ID }}
          AEROROUTE_FIREBASE_CREDENTIALS_JSON: ${{ secrets.AEROROUTE_FIREBASE_CREDENTIALS_JSON }}
        run: |
          python -m scripts.write_release_env "$RUNNER_TEMP/release.env" "$GITHUB_SHA"
      - name: Build exact image
        run: |
          docker build --tag "aeroroute-api:$GITHUB_SHA" backend
          docker save "aeroroute-api:$GITHUB_SHA" | gzip > "$RUNNER_TEMP/image.tar.gz"
      - name: Connect with pinned SSH host key
        env:
          DEPLOY_KEY: ${{ secrets.AEROROUTE_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.AEROROUTE_DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          python - <<'PY'
          import os
          from pathlib import Path
          import ipaddress
          from urllib.parse import urlsplit
          ipaddress.ip_address(os.environ['DEPLOY_HOST'])
          url = urlsplit(os.environ['BACKEND_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password:
              raise SystemExit('Configure the HTTPS backend origin')
          if not os.environ['DEPLOY_KEY'] or not os.environ['KNOWN_HOSTS']:
              raise SystemExit('Configure the private deployment key and pinned host key')
          folder = Path.home()/'.ssh'
          folder.mkdir(mode=0o700, exist_ok=True)
          (folder/'id_ed25519').write_text(os.environ['DEPLOY_KEY'].strip() + '\n')
          (folder/'known_hosts').write_text(os.environ['KNOWN_HOSTS'])
          PY
      - name: Upload and activate release
        run: |
          release="aeroroute/releases/$GITHUB_SHA"
          ssh -o StrictHostKeyChecking=yes "ubuntu@$DEPLOY_HOST" "mkdir -p '$release' && chmod 700 aeroroute aeroroute/releases '$release'"
          scp -o StrictHostKeyChecking=yes "$RUNNER_TEMP/image.tar.gz" "$RUNNER_TEMP/release.env" backend/deployment/deploy_vm.sh "ubuntu@$DEPLOY_HOST:$release/"
          ssh -o StrictHostKeyChecking=yes "ubuntu@$DEPLOY_HOST" "bash '$release/deploy_vm.sh' \"\$HOME/$release\" '$GITHUB_SHA'"
      - name: Verify public HTTPS release
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$BACKEND_URL/health" | python -c 'import json,os,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status")=="ok" and d.get("version")==os.environ["GITHUB_SHA"] else 1)'
      - name: Remove runner credentials
        if: always()
        run: rm -f "$HOME/.ssh/id_ed25519" "$RUNNER_TEMP/release.env"
